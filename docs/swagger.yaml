openapi: 3.1.0
info:
  title: BFF da Nani Perfumes
  description: |-
    Rotas que o site da Nani usa. Login, cadastro e sessão ficam aqui; o resto chama a commerce-api com o token da sessão. Erros no formato ProblemDetail: status, code e detail em português (os da commerce-api passam como vieram).
    Escrita (POST/PUT/PATCH/DELETE) exige o cabeçalho X-XSRF-TOKEN com o valor do cookie XSRF-TOKEN.
  version: "1.0"
servers:
- url: http://localhost:4200
  description: Pelo site (proxy do Angular)
- url: http://localhost:8090
  description: BFF direto
security:
- sessao: []
tags:
- name: Área do Cliente - Endereços
  description: Endereços salvos do cliente logado.
- name: Público - Autenticação
  description: "Entrar, criar conta e sessão. Sair: POST /api/auth/logout."
- name: Público - CEP
  description: "Endereço a partir do CEP, para preencher formulários."
- name: Área do Cliente - Minha Conta
  description: Dados da conta do cliente logado.
paths:
  /api/me/addresses/{id}:
    put:
      tags:
      - Área do Cliente - Endereços
      summary: Atualizar endereço
      operationId: atualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnderecoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EnderecoResponse"
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
    delete:
      tags:
      - Área do Cliente - Endereços
      summary: Remover endereço
      operationId: remover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /api/me/addresses:
    get:
      tags:
      - Área do Cliente - Endereços
      summary: Listar meus endereços
      operationId: listar
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnderecoResponse"
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
    post:
      tags:
      - Área do Cliente - Endereços
      summary: Cadastrar endereço
      operationId: cadastrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnderecoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EnderecoResponse"
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /api/me/profile:
    get:
      tags:
      - Área do Cliente - Minha Conta
      summary: Dados pessoais
      operationId: perfil
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PerfilResponse"
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
    patch:
      tags:
      - Área do Cliente - Minha Conta
      summary: Salvar celular e CPF
      operationId: atualizar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarPerfilRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PerfilResponse"
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /api/cep/{cep}:
    get:
      tags:
      - Público - CEP
      summary: Buscar endereço pelo CEP
      operationId: buscar
      parameters:
      - name: cep
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CepResponse"
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /api/auth/session:
    get:
      tags:
      - Público - Autenticação
      summary: Quem está logado (sempre 200)
      operationId: session
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessaoResponse"
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /api/auth/register:
    get:
      tags:
      - Público - Autenticação
      summary: Criar conta (abre o cadastro do Keycloak)
      operationId: register
      parameters:
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Vai para a tela do Keycloak
  /api/auth/profile:
    get:
      tags:
      - Público - Autenticação
      summary: Alterar nome (abre a tela do Keycloak e volta para returnTo)
      operationId: profile
      parameters:
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Vai para a tela do Keycloak
  /api/auth/password:
    get:
      tags:
      - Público - Autenticação
      summary: Trocar senha (abre a tela do Keycloak e volta para returnTo)
      operationId: password
      parameters:
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Vai para a tela do Keycloak
  /api/auth/login:
    get:
      tags:
      - Público - Autenticação
      summary: Entrar (vai para o Keycloak e volta para returnTo)
      operationId: login
      parameters:
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Vai para a tela do Keycloak
components:
  schemas:
    EnderecoRequest:
      type: object
      properties:
        cep:
          type: string
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        district:
          type: string
        city:
          type: string
        state:
          type: string
        isDefault:
          type: boolean
    EnderecoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        cep:
          type: string
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        district:
          type: string
        city:
          type: string
        state:
          type: string
        isDefault:
          type: boolean
    AtualizarPerfilRequest:
      type: object
      properties:
        phone:
          type: string
        cpf:
          type: string
    PerfilResponse:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        cpf:
          type: string
        phone:
          type: string
    CepResponse:
      type: object
      properties:
        cep:
          type: string
        street:
          type: string
        district:
          type: string
        city:
          type: string
        state:
          type: string
    MeResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    SessaoResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/MeResponse"
  securitySchemes:
    sessao:
      type: apiKey
      description: "Cookie de sessão HttpOnly, criado ao entrar pelo site"
      name: NANI_SESSION
      in: cookie
