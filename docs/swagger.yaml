openapi: 3.1.0
info:
  title: BFF da Nani Perfumes
  description: |-
    Rotas que o site da Nani usa. Login, cadastro e sessão ficam aqui; o resto chama a commerce-api com o token da sessão. Erros no formato ProblemDetail: status, code e detail em português (os da commerce-api passam como vieram).
    Escrita (POST/PUT/PATCH/DELETE) exige o cabeçalho X-XSRF-TOKEN com o valor do cookie XSRF-TOKEN.
  version: "1.0"
servers:
- url: http://localhost:4200
  description: Pelo site (proxy do Angular)
- url: http://localhost:8090
  description: BFF direto
security:
- sessao: []
tags:
- name: Área do Cliente - Endereços
  description: Endereços salvos do cliente logado.
- name: Público - CEP
  description: "Endereço a partir do CEP, para preencher formulários."
- name: Público - Vitrine
  description: Produtos publicados da loja.
- name: Área do Cliente - Minha Conta
  description: Dados da conta do cliente logado.
- name: Público - Autenticação
  description: "Entrar, criar conta e sessão. Sair: POST /bff/auth/logout."
paths:
  /bff/me/addresses/{id}:
    put:
      tags:
      - Área do Cliente - Endereços
      summary: Atualizar endereço
      operationId: atualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnderecoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EnderecoResponse"
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
    delete:
      tags:
      - Área do Cliente - Endereços
      summary: Remover endereço
      operationId: remover
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /bff/me/addresses:
    get:
      tags:
      - Área do Cliente - Endereços
      summary: Listar meus endereços
      operationId: listar
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnderecoResponse"
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
    post:
      tags:
      - Área do Cliente - Endereços
      summary: Cadastrar endereço
      operationId: cadastrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnderecoRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EnderecoResponse"
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /bff/me/profile:
    get:
      tags:
      - Área do Cliente - Minha Conta
      summary: Dados pessoais
      operationId: perfil
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PerfilResponse"
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
    patch:
      tags:
      - Área do Cliente - Minha Conta
      summary: Salvar celular e CPF
      operationId: atualizar_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarPerfilRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PerfilResponse"
        "401":
          description: Sem sessão (code SESSION_EXPIRED)
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /bff/cep/{cep}:
    get:
      tags:
      - Público - CEP
      summary: Buscar endereço pelo CEP
      operationId: buscar
      parameters:
      - name: cep
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CepResponse"
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /bff/catalog/products:
    get:
      tags:
      - Público - Vitrine
      summary: "Buscar produtos (filtros, ordem e página)"
      description: |-
        Parâmetros (todos opcionais; listas separadas por vírgula valem como "ou"): category, family,
        occasion, gender, brand, minPrice, maxPrice, q, inStock, kind, deal, launch, bestSeller, badge,
        sort (relevance | price_asc | price_desc | best_sellers | newest), page (começa em 0), size (1 a 60).
      operationId: buscar_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogoPaginaResponse"
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /bff/catalog/products/{slug}:
    get:
      tags:
      - Público - Vitrine
      summary: Produto pelo slug
      operationId: buscarPorSlug
      parameters:
      - name: slug
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogoProdutoResponse"
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /bff/catalog/filters:
    get:
      tags:
      - Público - Vitrine
      summary: Opções de filtro
      operationId: filtros
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogoFiltrosResponse"
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /bff/auth/session:
    get:
      tags:
      - Público - Autenticação
      summary: Quem está logado (sempre 200)
      operationId: session
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SessaoResponse"
        "502":
          description: commerce-api fora do ar ou lenta (code SERVICE_UNAVAILABLE)
  /bff/auth/register:
    get:
      tags:
      - Público - Autenticação
      summary: Criar conta (abre o cadastro do Keycloak)
      operationId: register
      parameters:
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Vai para a tela do Keycloak
  /bff/auth/profile:
    get:
      tags:
      - Público - Autenticação
      summary: Alterar nome (abre a tela do Keycloak e volta para returnTo)
      operationId: profile
      parameters:
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Vai para a tela do Keycloak
  /bff/auth/password:
    get:
      tags:
      - Público - Autenticação
      summary: Trocar senha (abre a tela do Keycloak e volta para returnTo)
      operationId: password
      parameters:
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Vai para a tela do Keycloak
  /bff/auth/login:
    get:
      tags:
      - Público - Autenticação
      summary: Entrar (vai para o Keycloak e volta para returnTo)
      operationId: login
      parameters:
      - name: returnTo
        in: query
        required: false
        schema:
          type: string
      responses:
        "302":
          description: Vai para a tela do Keycloak
components:
  schemas:
    EnderecoRequest:
      type: object
      properties:
        cep:
          type: string
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        district:
          type: string
        city:
          type: string
        state:
          type: string
        isDefault:
          type: boolean
    EnderecoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        cep:
          type: string
        street:
          type: string
        number:
          type: string
        complement:
          type: string
        district:
          type: string
        city:
          type: string
        state:
          type: string
        isDefault:
          type: boolean
    AtualizarPerfilRequest:
      type: object
      properties:
        phone:
          type: string
        cpf:
          type: string
    PerfilResponse:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        cpf:
          type: string
        phone:
          type: string
    CepResponse:
      type: object
      properties:
        cep:
          type: string
        street:
          type: string
        district:
          type: string
        city:
          type: string
        state:
          type: string
    CatalogoNotasResponse:
      type: object
      properties:
        top:
          type: array
          items:
            type: string
        heart:
          type: array
          items:
            type: string
        base:
          type: array
          items:
            type: string
    CatalogoPaginaResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogoProdutoResponse"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    CatalogoProdutoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        line:
          type: string
        subtitle:
          type: string
        name:
          type: string
        description:
          type: string
        brandId:
          type: integer
          format: int64
        brandName:
          type: string
        category:
          type: string
        gender:
          type: string
        concentration:
          type: string
        families:
          type: array
          items:
            type: string
        notes:
          $ref: "#/components/schemas/CatalogoNotasResponse"
        kitItems:
          type: array
          items:
            type: string
        occasions:
          type: array
          items:
            type: string
        launch:
          type: boolean
        bestSeller:
          type: boolean
        badge:
          type: string
        soldCount:
          type: integer
          format: int32
        images:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            $ref: "#/components/schemas/CatalogoVarianteResponse"
    CatalogoVarianteResponse:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        volumeMl:
          type: integer
          format: int32
        price:
          type: number
        promoPrice:
          type: number
        stock:
          type: integer
          format: int32
    CatalogoFiltrosResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
        brands:
          type: array
          items:
            type: string
        families:
          type: array
          items:
            type: string
        occasions:
          type: array
          items:
            type: string
        genders:
          type: array
          items:
            type: string
        badges:
          type: array
          items:
            type: string
        minPrice:
          type: number
        maxPrice:
          type: number
    MeResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    SessaoResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        user:
          $ref: "#/components/schemas/MeResponse"
  securitySchemes:
    sessao:
      type: apiKey
      description: "Cookie de sessão HttpOnly, criado ao entrar pelo site"
      name: NANI_SESSION
      in: cookie
