spring.application.name=commerce-bff-nani

# Segredos locais (não versionado). Em produção vêm de variáveis de ambiente / SSM.
spring.config.import=optional:file:.env[.properties]

server.port=8090
# Atrás do Caddy/CloudFront em produção: respeita X-Forwarded-*.
server.forward-headers-strategy=framework

# Sessão em memória (A1): os tokens ficam só na RAM do BFF, nunca em disco.
# Expirou? O Keycloak religa o cliente sem pedir senha (sessão dele: 7 dias).
server.servlet.session.timeout=1d
server.servlet.session.cookie.name=NANI_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

management.endpoints.web.exposure.include=health

# Keycloak (commerce-auth), realm da Nani
# Endereço que o NAVEGADOR usa (vira o "issuer" dos tokens)
nani.auth.public-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8180/auth}
# Endereço que o BFF usa por dentro (em produção, a rede interna do Docker)
nani.auth.internal-url=${KEYCLOAK_INTERNAL_URL:http://localhost:8180/auth}
nani.auth.realm=nani
nani.auth.client-id=commerce-bff-nani
nani.auth.client-secret=${NANI_AUTH_CLIENT_SECRET}
# Pelo proxy do Angular em desenvolvimento; em produção, https://www.naniperfumes.com.br/...
nani.auth.redirect-uri=${NANI_AUTH_REDIRECT_URI:http://localhost:4200/login/oauth2/code/nani}
nani.auth.post-logout-redirect-uri=${NANI_AUTH_POST_LOGOUT_URI:http://localhost:4200/}

# commerce-api (servidor para servidor). Em produção, o endereço interno da rede do Docker.
nani.api.url=${COMMERCE_API_URL:http://localhost:8081}

# Swagger (http://localhost:8090/swagger-ui.html). Em produção: SWAGGER_ENABLED=false.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
# O "Try it out" manda o X-XSRF-TOKEN nas escritas, como o Angular.
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.csrf.cookie-name=XSRF-TOKEN
springdoc.swagger-ui.csrf.header-name=X-XSRF-TOKEN

# Busca de CEP (serviços públicos): ViaCEP e, se ele falhar, BrasilAPI. Prazos curtos: se demorar,
# o cliente preenche o endereço na mão.
nani.cep.viacep-url=https://viacep.com.br
nani.cep.brasilapi-url=https://brasilapi.com.br

# Feign: prazos por client, em milissegundos (A9: serviço fora do ar não prende o BFF). Sem seguir
# redirecionamento. hc5 porque o cliente HTTP padrão do Feign não faz PATCH.
spring.cloud.openfeign.httpclient.hc5.enabled=true
spring.cloud.openfeign.client.config.default.follow-redirects=false
spring.cloud.openfeign.client.config.commerce-api.connect-timeout=2000
spring.cloud.openfeign.client.config.commerce-api.read-timeout=10000
spring.cloud.openfeign.client.config.viacep.connect-timeout=2000
spring.cloud.openfeign.client.config.viacep.read-timeout=3000
spring.cloud.openfeign.client.config.brasilapi.connect-timeout=2000
spring.cloud.openfeign.client.config.brasilapi.read-timeout=3000
