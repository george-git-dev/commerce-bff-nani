spring:
  application:
    name: commerce-bff-nani
  # Segredos locais (não versionado). Em produção vêm de variáveis de ambiente / SSM.
  config:
    import: optional:file:.env[.properties]

server:
  port: 8090
  # Atrás do Caddy/CloudFront em produção: respeita X-Forwarded-*.
  forward-headers-strategy: framework
  servlet:
    session:
      # Sessão em memória (A1): os tokens ficam só na RAM do BFF, nunca em disco.
      # Expirou? O Keycloak religa o cliente sem pedir senha (sessão dele: 7 dias).
      timeout: 1d
      cookie:
        name: NANI_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

# Keycloak (commerce-auth), realm da Nani
nani:
  auth:
    # Endereço que o NAVEGADOR usa (vira o "issuer" dos tokens)
    public-url: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180/auth}
    # Endereço que o BFF usa por dentro (em produção, a rede interna do Docker)
    internal-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180/auth}
    realm: nani
    client-id: commerce-bff-nani
    client-secret: ${NANI_AUTH_CLIENT_SECRET}
    # Pelo proxy do Angular em desenvolvimento; em produção, https://www.naniperfumes.com.br/...
    redirect-uri: ${NANI_AUTH_REDIRECT_URI:http://localhost:4200/login/oauth2/code/nani}
    post-logout-redirect-uri: ${NANI_AUTH_POST_LOGOUT_URI:http://localhost:4200/}
